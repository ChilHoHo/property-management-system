{% extends 'base.html' %}
{% block title %}员工工作台{% endblock %}
{% block content %}
<div class="page-header"><h2>&#9679; 物业员工工作台</h2></div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">&#128100;</div>
        <div class="stat-number">{{ owner_count }}</div>
        <div class="stat-label">业主总数</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#127968;</div>
        <div class="stat-number">{{ house_count }}</div>
        <div class="stat-label">房屋总数</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#9203;</div>
        <div class="stat-number">{{ pending_repair }}</div>
        <div class="stat-label">待处理报修</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#128172;</div>
        <div class="stat-number">{{ pending_complaint }}</div>
        <div class="stat-label">待处理投诉</div>
    </div>
</div>
{% endblock %}
