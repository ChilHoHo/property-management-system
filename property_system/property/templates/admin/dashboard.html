{% extends 'base.html' %}
{% block title %}管理员主页{% endblock %}
{% block content %}
<div class="page-header"><h2>&#9679; 管理员工作台</h2></div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">&#128100;</div>
        <div class="stat-number">{{ owner_count }}</div>
        <div class="stat-label">业主总数</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#127968;</div>
        <div class="stat-number">{{ house_count }}</div>
        <div class="stat-label">房屋总数</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#128104;&#8205;&#128188;</div>
        <div class="stat-number">{{ staff_count }}</div>
        <div class="stat-label">员工人数</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#128176;</div>
        <div class="stat-number">{{ fee_count }}</div>
        <div class="stat-label">物业费记录</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#128295;</div>
        <div class="stat-number">{{ repair_count }}</div>
        <div class="stat-label">报修工单</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">&#128172;</div>
        <div class="stat-number">{{ complaint_count }}</div>
        <div class="stat-label">投诉建议</div>
    </div>
</div>
{% endblock %}
