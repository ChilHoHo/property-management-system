{% extends 'base.html' %}
{% block title %}公告管理{% endblock %}
{% block content %}
<h2>公告列表</h2>
<table class="data-table">
    <thead>
        <tr><th>ID</th><th>标题</th><th>发布人</th><th>发布时间</th><th>业主可见</th></tr>
    </thead>
    <tbody>
        {% for n in notices %}
        <tr>
            <td>{{ n.id }}</td>
            <td>{{ n.title }}</td>
            <td>{{ n.publisher.name }}</td>
            <td>{{ n.publish_time|date:'Y-m-d H:i' }}</td>
            <td>{{ n.is_public|yesno:'是,否' }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="empty-row">暂无公告</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
