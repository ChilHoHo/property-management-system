{% extends 'base.html' %}
{% block title %}业主管理{% endblock %}
{% block content %}
<h2>业主列表</h2>
<table class="data-table">
    <thead>
        <tr><th>ID</th><th>姓名</th><th>性别</th><th>电话</th><th>身份证号</th><th>地址</th></tr>
    </thead>
    <tbody>
        {% for o in owners %}
        <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.user.name }}</td>
            <td>{{ o.gender }}</td>
            <td>{{ o.user.phone|default:'-' }}</td>
            <td>{{ o.id_card }}</td>
            <td>{{ o.address|default:'-' }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="6" class="empty-row">暂无业主数据</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
