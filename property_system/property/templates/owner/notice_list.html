{% extends 'base.html' %}
{% block title %}小区公告{% endblock %}
{% block content %}
<h2>小区公告</h2>

{% for n in notices %}
<div class="card">
    <h3>{{ n.title }}</h3>
    <p class="text-muted">发布人: {{ n.publisher.name }} | 时间: {{ n.publish_time|date:'Y-m-d H:i' }}</p>
    <p>{{ n.content }}</p>
</div>
{% empty %}
<div class="card"><p class="empty-row">暂无公告</p></div>
{% endfor %}
{% endblock %}
