{% extends 'base.html' %}
{% block title %}提交报修{% endblock %}
{% block content %}
<h2>提交报修</h2>
<form method="post" class="form-card">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<span class="error">{{ field.errors.0 }}</span>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">提交报修</button>
    <a href="{% url 'owner_repair_list' %}" class="btn">返回</a>
</form>
{% endblock %}
