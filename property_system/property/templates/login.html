<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小区物业管理系统</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>&#127968; 小区物业管理系统</h1>
        <h3>数据库课程大作业</h3>

        {% if messages %}
        <div class="messages">
            {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label>选择角色</label>
                {{ form.role }}
            </div>
            <div class="form-group">
                <label>用户名</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label>密码</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px; padding:12px; font-size:15px;">登 录</button>
        </form>
    </div>
</body>
</html>
